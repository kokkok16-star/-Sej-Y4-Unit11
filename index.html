<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单元十一《著名海军统帅汉都亚》答题挑战</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --text: #1f2937;
      --accent: #d97706;
      --success: #10b981;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
    }

    .container {
      background: var(--card-bg);
      width: 100%;
      max-width: 850px;
      border-radius: 20px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
      padding: 35px 30px;
      position: relative;
      overflow: hidden;
    }

    /* Header & Teacher Button */
    header {
      text-align: center;
      margin-bottom: 25px;
      position: relative;
      padding-top: 10px;
    }

    h1 {
      color: var(--primary);
      font-size: 1.8rem;
      margin-bottom: 6px;
      font-weight: 800;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.95rem;
    }

    /* 显眼的“教师专区”按钮 */
    .teacher-btn-top {
      position: absolute;
      top: 0;
      right: 0;
      background: #eef2ff;
      color: var(--primary);
      border: 1.5px solid #c7d2fe;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .teacher-btn-top:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
    }

    /* Screens */
    .screen {
      display: none;
    }

    .screen.active {
      display: block;
      animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Forms & Inputs */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #374151;
      font-size: 0.95rem;
    }

    input[type="text"], input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #6b7280;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background-color: #4b5563;
    }

    .error-msg {
      color: var(--error);
      font-size: 0.85rem;
      margin-top: 6px;
      display: none;
      font-weight: 600;
    }

    /* Quiz Area */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #f3f4f6;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 700;
      color: #4b5563;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.6;
      color: #111827;
    }

    .options-grid {
      display: grid;
      gap: 12px;
    }

    .option-btn {
      background: #f9fafb;
      border: 2px solid #e5e7eb;
      padding: 14px 18px;
      border-radius: 12px;
      text-align: left;
      font-size: 0.98rem;
      cursor: pointer;
      transition: all 0.2s;
      color: #374151;
      font-weight: 500;
      line-height: 1.4;
    }

    .option-btn:hover {
      border-color: var(--primary);
      background-color: #eef2ff;
      color: var(--primary);
    }

    .option-btn.correct {
      background-color: #d1fae5 !important;
      border-color: var(--success) !important;
      color: #065f46 !important;
      font-weight: 700;
    }

    .option-btn.wrong {
      background-color: #fee2e2 !important;
      border-color: var(--error) !important;
      color: #991b1b !important;
      font-weight: 700;
    }

    .explanation-box {
      margin-top: 20px;
      padding: 16px;
      background-color: #eff6ff;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      display: none;
      animation: fadeIn 0.3s ease-in-out;
    }

    .explanation-title {
      font-weight: 700;
      color: #1e40af;
      margin-bottom: 6px;
      font-size: 0.95rem;
    }

    .explanation-content {
      font-size: 0.92rem;
      color: #1e3a8a;
      line-height: 1.5;
    }

    .next-btn-container {
      margin-top: 22px;
      display: none;
    }

    /* Leaderboard & Layout */
    .quiz-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
    }

    @media (min-width: 768px) {
      .quiz-layout.with-sidebar {
        grid-template-columns: 1.4fr 1fr;
      }
    }

    .leaderboard-card {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      padding: 18px;
      max-height: 380px;
      overflow-y: auto;
    }

    .leaderboard-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .leaderboard-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: white;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid #f1f5f9;
      font-size: 0.9rem;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .rank {
      font-weight: 800;
      color: var(--primary);
      width: 22px;
      display: inline-block;
    }

    /* Admin Styles */
    .admin-modal {
      background: #f8fafc;
      border-radius: 14px;
      padding: 24px;
      border: 1px solid #e2e8f0;
      max-width: 450px;
      margin: 0 auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 0.88rem;
      background: white;
      border-radius: 10px;
      overflow: hidden;
    }

    .admin-table th, .admin-table td {
      border: 1px solid #e5e7eb;
      padding: 12px 10px;
      text-align: left;
    }

    .admin-table th {
      background-color: #f3f4f6;
      font-weight: 700;
      color: #374151;
    }
  </style>
</head>

        <div id="result-leaderboard">加载中...</div>
      </div>

      <button class="btn" onclick="location.reload()">再测一次 🔄</button>
    </div>
  </div>

  <!-- 4. 教师专区登录密码验证界面 -->
  <div id="screen-admin-login" class="screen">
    <div class="admin-modal">
      <h2 style="color: var(--primary); margin-bottom: 10px; font-size: 1.4rem; text-align: center;">🔐 教师专区身份验证</h2>
      <p style="color: #6b7280; font-size: 0.9rem; text-align: center; margin-bottom: 20px;">请输入教师后台专属管理密码</p>

      <button class="btn" id="admin-login-btn">登录后台</button>
      <button class="btn btn-secondary" id="admin-cancel-btn" style="margin-top: 10px;">取消返回</button>
    </div>
  </div>

  <!-- 5. 教师后台数据记录展示界面 -->
  <div id="screen-admin-dashboard" class="screen">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
      <div>
        <h2 style="color: var(--primary); font-size: 1.5rem;">📊 教师后台 - 学生答题记录</h2>

      <button class="btn btn-secondary" style="width: auto; padding: 10px 18px;" id="admin-logout-btn">退出教师后台</button>
    </div>

    <div style="overflow-x: auto;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>学生姓名</th>
            <th>教育部 Email</th>
            <th>得分</th>
            <th>用时 (秒)</th>

  </div>

</div>

      q: "9. 汉都亚精通多少种语言？这项技能对自己执行马六甲公职有何重要作用？",
      options: [
        "A. 5 种；便于他在马六甲市内与本地商人交易",
        "B. 8 种；便于他指挥马六甲军队作战",
        "C. 12 种；便于他出使中国、印度和土耳其等国，维护马六甲国誉",
        "D. 15 种；便于他翻译经典的宗教文献"
      ],
      correct: 2,
      exp: "汉都亚精通 12 种语言，便于出使中国、印度和土耳其等国家，维护马六甲的国誉与外交地位。"
    },
    {
      q: "10. 汉都亚运用才智说服敦蒂惹（Tun Teja）嫁给马六甲苏丹，这展现了他的哪一种个人素质？",
      options: [
        "A. 精通马来武术",
        "B. 睿智与才智",
        "C. 诚实守信",
        "D. 忠于朋友"
      ],
      correct: 1,
      exp: "汉都亚运用才智说服敦蒂惹嫁给苏丹，展现了他睿智的个人素质。"
    }
  ];

  // State Variables
  let currentQuestion = 0;
  let score = 0;
  let studentInfo = { name: "", email: "" };
  let startTime = null;
  let answered = false;

  // DOM Elements
  const screens = {
    login: document.getElementById('screen-login'),
    quiz: document.getElementById('screen-quiz'),
    result: document.getElementById('screen-result'),
    adminLogin: document.getElementById('screen-admin-login'),
    adminDashboard: document.getElementById('screen-admin-dashboard')
  };

  function switchScreen(screenKey) {
    Object.values(screens).forEach(s => s.classList.remove('active'));
    screens[screenKey].classList.add('active');
  }

  // 4. 实时排行榜 (单字段查询，避免依赖复合索引)
  function setupRealtimeLeaderboard() {
    // 仅按 score 降序查询，避免触发复合索引报错
    const q = query(collection(db, "quiz_results"), orderBy("score", "desc"), limit(20));
    onSnapshot(q, (snapshot) => {
      const items = [];
      snapshot.forEach((doc) => {
        items.push(doc.data());
      });

      // 在前端内存中排序：分数相同按用时升序
      items.sort((a, b) => {
        if (b.score !== a.score) return b.score - a.score;
        return (a.timeTaken || 0) - (b.timeTaken || 0);
      });

      // 取前5名
      const top5 = items.slice(0, 5);

      let html = "";
      let rank = 1;
      top5.forEach((data) => {
        html += `
          <div class="leaderboard-item">
            <div><span class="rank">${rank}.</span> <b>${escapeHtml(data.name)}</b></div>
            <div><span style="color:var(--primary); font-weight:bold;">${data.score}分</span> <small style="color:#9ca3af;">(${data.timeTaken || 0}s)</small></div>
          </div>
        `;
        rank++;
      });

      if(html === "") html = "<div style='color:#9ca3af; text-align:center; padding:15px;'>暂无数据，快来第一个挑战！</div>";
      document.getElementById('realtime-leaderboard').innerHTML = html;
      document.getElementById('result-leaderboard').innerHTML = html;
    }, (error) => {
      console.error("排行榜监听异常:", error);
    });
  }

  function escapeHtml(str) {
    if(!str) return "";
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 5. 开始答题与验证
  document.getElementById('start-btn').addEventListener('click', () => {
    const nameInput = document.getElementById('student-name').value.trim();
    const emailInput = document.getElementById('student-email').value.trim();
    const nameErr = document.getElementById('name-error');
    const emailErr = document.getElementById('email-error');

    let valid = true;
    if (!nameInput) {
      nameErr.style.display = 'block';
      valid = false;
    } else {
      nameErr.style.display = 'none';
    }

    // 强制验证以 @moe-dl.edu.my 结尾
    if (!emailInput.toLowerCase().endsWith('@moe-dl.edu.my')) {
      emailErr.style.display = 'block';
      valid = false;
    } else {
      emailErr.style.display = 'none';
    }

    if (valid) {
      studentInfo.name = nameInput;
      studentInfo.email = emailInput;
      startTime = new Date();
      switchScreen('quiz');
      loadQuestion();
    }
  });

  // 6. 渲染题目
  function loadQuestion() {
    answered = false;
    const data = quizData[currentQuestion];
    document.getElementById('current-index').textContent = currentQuestion + 1;
    document.getElementById('question-text').textContent = data.q;
    document.getElementById('explanation-box').style.display = 'none';
    document.getElementById('next-btn-container').style.display = 'none';

    const container = document.getElementById('options-container');
    container.innerHTML = '';

    data.options.forEach((opt, index) => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.textContent = opt;
      btn.onclick = () => selectOption(index);
      container.appendChild(btn);
    });
  }

  // 7. 选择选项与回答处理
  function selectOption(index) {
    if (answered) return;
    answered = true;

    const data = quizData[currentQuestion];
    const buttons = document.querySelectorAll('.option-btn');

    if (index === data.correct) {
      buttons[index].classList.add('correct');
      AudioFX.playCorrect();
      score += 10;
      document.getElementById('current-score').textContent = score;
    } else {
      buttons[index].classList.add('wrong');
      buttons[data.correct].classList.add('correct');
      AudioFX.playWrong();
      
      // 显示错题解答解析
      document.getElementById('explanation-text').textContent = data.exp;
      document.getElementById('explanation-box').style.display = 'block';
    }

    buttons.forEach(btn => btn.style.pointerEvents = 'none');
    document.getElementById('next-btn-container').style.display = 'block';
  }

  // 点击“下一题”
  document.getElementById('next-btn').addEventListener('click', () => {
    currentQuestion++;
    if (currentQuestion < quizData.length) {
      loadQuestion();
    } else {
      finishQuiz();
    }
  });

  // 8. 答题结算与提交到 Firebase
  async function finishQuiz() {
    const endTime = new Date();
    const timeTaken = Math.round((endTime - startTime) / 1000);

    document.getElementById('final-score').textContent = score;
    let comment = "🌟 太棒了！你对汉都亚的历史非常了解！";
    if (score < 60) comment = "💪 还需要继续加油哦，多复习课本知识！";
    else if (score < 90) comment = "👍 表现不错！差一点就拿满分了！";
    document.getElementById('result-comment').textContent = comment;

    switchScreen('result');

    // 保存到 Firebase Firestore
    try {
      await addDoc(collection(db, "quiz_results"), {
        name: studentInfo.name,
        email: studentInfo.email,
        score: score,
        timeTaken: timeTaken,
        timestamp: serverTimestamp()
      });
    } catch (e) {
      console.error("保存成绩失败: ", e);
    }
  }

  // 9. 教师专区逻辑 (密码: 2020Hui%%)
  const TEACHER_PASS = "2020Hui%%";

  document.getElementById('teacher-zone-btn').addEventListener('click', () => {
    document.getElementById('admin-pass-input').value = '';
    document.getElementById('admin-pass-error').style.display = 'none';
    switchScreen('adminLogin');
  });

  document.getElementById('admin-cancel-btn').addEventListener('click', () => {
    switchScreen('login');
  });

  document.getElementById('admin-login-btn').addEventListener('click', () => {
    const inputPass = document.getElementById('admin-pass-input').value;
    const err = document.getElementById('admin-pass-error');
    
    // 密码校验 (隐蔽展示，文本框格式为 password)
    if (inputPass === TEACHER_PASS) {
      err.style.display = 'none';
      switchScreen('adminDashboard');
      loadAdminData();
    } else {
      err.style.display = 'block';
    }
  });

  document.getElementById('admin-logout-btn').addEventListener('click', () => {
    switchScreen('login');
  });

  // 10. 加载教师后台完整记录
  function loadAdminData() {
    const q = query(collection(db, "quiz_results"));
    onSnapshot(q, (snapshot) => {
      const tbody = document.getElementById('admin-data-body');
      const records = [];
      snapshot.forEach((doc) => {
        records.push(doc.data());
      });

      // 在前端按照提交时间降序排列
      records.sort((a, b) => {
        const timeA = a.timestamp ? a.timestamp.toDate().getTime() : 0;
        const timeB = b.timestamp ? b.timestamp.toDate().getTime() : 0;
        return timeB - timeA;
      });

      let html = "";
      records.forEach((data) => {
        let dateStr = "近期";
        if (data.timestamp) {
          dateStr = new Date(data.timestamp.toDate()).toLocaleString('zh-CN');
        }
        html += `
          <tr>
            <td><b>${escapeHtml(data.name)}</b></td>
            <td>${escapeHtml(data.email)}</td>
            <td><span style="color:var(--primary); font-weight:bold;">${data.score} 分</span></td>
            <td>${data.timeTaken || 0} 秒</td>
            <td><small style="color:#6b7280;">${dateStr}</small></td>
          </tr>
        `;
      });
      if (html === "") html = "<tr><td colspan='5' style='text-align: center; color:#9ca3af; padding: 20px;'>暂无学生答题记录</td></tr>";
      tbody.innerHTML = html;
    });
  }

  // 初始化排行榜监听
  setupRealtimeLeaderboard();
</script>
</body>
</html>
